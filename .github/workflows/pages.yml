name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build production frontend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_MUXTRAIL_API_BASE: https://api.muxtrail.com/api
          VITE_MUXTRAIL_WS_URL: wss://api.muxtrail.com/ws
          VITE_MUXTRAIL_ACCESS_LOGIN_URL: https://api.muxtrail.com/api/status
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-backend:
    name: Deploy GCE backend
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Validate deployment configuration
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_SSH_PRIVATE_KEY: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          GCE_SSH_KNOWN_HOSTS: ${{ secrets.GCE_SSH_KNOWN_HOSTS }}
          GCE_USER: ${{ vars.GCE_USER }}
          GCE_APP_DIR: ${{ vars.GCE_APP_DIR }}
        run: |
          test -n "$GCE_HOST" || { echo "Missing GCE_HOST secret"; exit 1; }
          test -n "$GCE_SSH_PRIVATE_KEY" || { echo "Missing GCE_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$GCE_SSH_KNOWN_HOSTS" || { echo "Missing GCE_SSH_KNOWN_HOSTS secret"; exit 1; }
          test -n "$GCE_USER" || { echo "Missing GCE_USER variable"; exit 1; }
          test -n "$GCE_APP_DIR" || { echo "Missing GCE_APP_DIR variable"; exit 1; }

      - name: Configure SSH
        env:
          GCE_SSH_PRIVATE_KEY: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          GCE_SSH_KNOWN_HOSTS: ${{ secrets.GCE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GCE_SSH_PRIVATE_KEY" > "$HOME/.ssh/muxtrail_deploy"
          chmod 600 "$HOME/.ssh/muxtrail_deploy"
          printf '%s\n' "$GCE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Update and restart backend
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_USER: ${{ vars.GCE_USER }}
          GCE_APP_DIR: ${{ vars.GCE_APP_DIR }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/muxtrail_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$GCE_USER@$GCE_HOST" \
            "MUXTRAIL_APP_DIR='$GCE_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$MUXTRAIL_APP_DIR"
          git fetch --prune origin "$DEPLOY_SHA"
          git checkout main
          git merge --ff-only "$DEPLOY_SHA"
          .venv/bin/python -m pip install -e .
          sudo -n systemctl restart muxtrail

          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18789/api/status > /dev/null; then
              echo "MuxTrail backend is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "MuxTrail backend failed its health check."
          sudo -n journalctl -u muxtrail -n 50 --no-pager
          exit 1
          REMOTE

  deploy-frontend:
    name: Deploy GitHub Pages frontend
    needs: [build-frontend, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
